<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSI Cancer Detection | AI-Powered Pathology Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:750px;
max-width:90%;
background:white;
border-radius:20px;
box-shadow:0 25px 80px rgba(0,0,0,0.25);
overflow:hidden;
}

.header{
background:linear-gradient(135deg,#667eea,#764ba2);
padding:28px;
text-align:center;
color:white;
}

.header h1{
font-size:24px;
font-weight:600;
}

.logo{
font-size:26px;
margin-right:6px;
}

.content{padding:30px;}

.upload-area{
border:2px dashed #d1d5db;
border-radius:14px;
padding:40px 25px;
text-align:center;
background:#f9fafb;
cursor:pointer;
}

.upload-area:hover{
border-color:#667eea;
background:#eef1ff;
}

.upload-icon{font-size:50px;margin-bottom:10px;}

.upload-text{font-size:16px;font-weight:600;}

.upload-subtext{color:#6b7280;font-size:13px;}

.file-input{display:none;}

.selected-file{
margin-top:15px;
background:#f3f4f6;
padding:12px;
border-radius:10px;
display:none;
}

.selected-file.show{display:block;}

.file-info{display:flex;align-items:center;gap:10px;}

.file-icon{font-size:22px;}

.file-name{font-weight:600;}

.file-size{font-size:12px;color:#6b7280;}

.btn{
margin-top:18px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:14px;
font-weight:600;
color:white;
background:linear-gradient(135deg,#667eea,#764ba2);
cursor:pointer;
}

.loading{display:none;text-align:center;padding:30px;}
.loading.show{display:block;}

.spinner{
width:38px;
height:38px;
border:4px solid #e5e7eb;
border-top:4px solid #667eea;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{to{transform:rotate(360deg);}}

.result{display:none;}
.result.show{display:block;}

.result-header{text-align:center;margin-bottom:20px;}

.result-icon{font-size:50px;}

.result-title{font-size:22px;font-weight:700;}

.result-subtitle{font-size:13px;color:#6b7280;}

.result-card{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

.prediction-value{
font-size:26px;
font-weight:700;
}

.probability-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.prob-item{
background:rgba(255,255,255,0.2);
padding:10px;
border-radius:6px;
}

.metadata{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.metadata-item{
background:#f9fafb;
padding:12px;
border-radius:8px;
}

.metadata-label{font-size:11px;color:#6b7280;}

.metadata-value{font-weight:600;}

.heatmap-section{
margin-top:15px;
background:#f9fafb;
padding:15px;
border-radius:10px;
}

.heatmap-image{
width:100%;
border-radius:6px;
}

.heatmap-legend{
display:flex;
justify-content:center;
gap:20px;
margin-top:10px;
}

.legend-item{
display:flex;
align-items:center;
gap:6px;
}

.legend-color{
width:16px;
height:16px;
border-radius:4px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.btn-secondary{
background:white;
color:#667eea;
border:2px solid #667eea;
flex:1;
}

.btn-primary{flex:1;}

.error-banner{
background:#fff3cd;
border-left:5px solid #dc3545;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

.retry-btn{
display:inline-block;
margin-top:10px;
background:#dc3545;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
}

.footer{
padding:14px;
text-align:center;
font-size:11px;
background:#f9fafb;
color:#6b7280;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1><span class="logo">🧬</span> WSI Cancer Detection</h1>
</div>

<div class="content">

<form method="POST" enctype="multipart/form-data" id="uploadForm">

<div class="upload-area" id="uploadArea">
<div class="upload-icon">📁</div>
<div class="upload-text">Drop your WSI file here</div>
<div class="upload-subtext">or click to browse</div>
<div class="upload-subtext" style="font-size:12px;margin-top:6px">
Supports .tif .tiff
</div>
</div>

<input type="file" name="file" id="fileInput" class="file-input">

<div class="selected-file" id="selectedFile">
<div class="file-info">
<div class="file-icon">📄</div>
<div>
<div class="file-name" id="fileName"></div>
<div class="file-size" id="fileSize"></div>
</div>
</div>
</div>

<button class="btn">Analyze Slide</button>

</form>

<div class="loading" id="loading">
<div class="spinner"></div>
<p style="margin-top:10px;color:#6b7280">Analyzing whole slide image...</p>
</div>

</div>

<div class="footer">
© 2026 WSI Cancer Detection System
</div>

</div>

<script>

const uploadArea=document.getElementById("uploadArea")
const fileInput=document.getElementById("fileInput")
const selectedFile=document.getElementById("selectedFile")

uploadArea.addEventListener("click",()=>fileInput.click())

fileInput.addEventListener("change",(e)=>{

const file=e.target.files[0]

if(!file) return

const allowed=["tif","tiff"]

const ext=file.name.split(".").pop().toLowerCase()

if(!allowed.includes(ext)){

alert("Invalid format")

fileInput.value=""

return
}

document.getElementById("fileName").innerText=file.name
document.getElementById("fileSize").innerText=(file.size/1024/1024).toFixed(2)+" MB"

selectedFile.classList.add("show")

})

</script>

</body>
</html>
